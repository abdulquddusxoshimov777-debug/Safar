<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Popular Places & Monuments — Saffar</title>
<meta name="description" content="Explore ancient cities, historic monuments and natural wonders across Uzbekistan.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- Leaflet.js -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<link rel="stylesheet" href="css/style.css?v=2.2">
<style>
  .btn-detail {
    display: inline-block;
    padding: 8px 14px;
    background: var(--sand-deep);
    border: 1px solid var(--sand-dark);
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--charcoal);
    text-decoration: none;
    transition: background 0.2s;
  }
  .btn-detail:hover {
    background: var(--sand-dark);
  }
</style>
</head>
<body>

<div id="site-header"></div>

<section style="padding-top:28px;">
  <div class="container">
    <div class="section-head" style="margin-bottom:20px;">
      <div>
        <span class="eyebrow" id="placeCountLabel" data-i18n="places_eyebrow">5 Legendary Destinations</span>
        <h2 data-i18n="dest_h2">Explore the legendary cities of the Silk Road, each with its own colour and character.</h2>
        <p style="margin-top:6px; color:rgba(28,26,23,0.7);"></p>
      </div>
    </div>

    <!-- VILOYAT / CITY FILTERS -->
    <div class="filter-section-title" data-i18n="filter_region_title" style="font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: rgba(28,26,23,0.5); margin-bottom: 6px;">📍 Viloyat / Shahar:</div>
    <div class="filters" id="placeCityFilterRow" style="margin-bottom: 12px;">
      <button type="button" class="pill active" data-city="All"><span data-i18n="filter_all_regions">🌐 Barcha viloyatlar</span></button>
      <button type="button" class="pill" data-city="Tashkent"><span data-i18n="city_tashkent">Toshkent</span></button>
      <button type="button" class="pill" data-city="Andijan"><span data-i18n="city_andijan">Andijon</span></button>
      <button type="button" class="pill" data-city="Bukhara"><span data-i18n="city_bukhara">Buxoro</span></button>
      <button type="button" class="pill" data-city="Jizzakh"><span data-i18n="city_jizzakh">Jizzax</span></button>
      <button type="button" class="pill" data-city="Kashkadarya"><span data-i18n="city_kashkadarya">Qashqadaryo</span></button>
      <button type="button" class="pill" data-city="Navoiy"><span data-i18n="city_navoiy">Navoiy</span></button>
      <button type="button" class="pill" data-city="Namangan"><span data-i18n="city_namangan">Namangan</span></button>
      <button type="button" class="pill" data-city="Samarkand"><span data-i18n="city_samarkand">Samarqand</span></button>
      <button type="button" class="pill" data-city="Surkhandarya"><span data-i18n="city_surkhandarya">Surxondaryo</span></button>
      <button type="button" class="pill" data-city="Sirdarya"><span data-i18n="city_sirdarya">Sirdaryo</span></button>
      <button type="button" class="pill" data-city="Fergana"><span data-i18n="city_fergana">Farg`ona</span></button>
      <button type="button" class="pill" data-city="Khorazm"><span data-i18n="city_khorazm">Xorazm</span></button>
    </div>

    <!-- CATEGORY FILTERS -->
    <div class="filter-section-title" data-i18n="filter_place_type_title" style="font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: rgba(28,26,23,0.5); margin-bottom: 6px;">🎯 Joy turi:</div>
    <div class="filters" id="placeCategoryFilterRow">
      <button type="button" class="pill active" data-category="All"><span data-i18n="filter_all_types">🌐 Barcha turlar</span></button>
      <button type="button" class="pill" data-category="Monuments"><span data-i18n="place_cat_monuments">🏛 Tarixiy obidalar</span></button>
      <button type="button" class="pill" data-category="Parks"><span data-i18n="place_cat_parks">🌳 Bog'lar & Parklar</span></button>
      <button type="button" class="pill" data-category="Bazaars"><span data-i18n="place_cat_bazaars">🛍 Bozorlar</span></button>
      <button type="button" class="pill" data-category="Nature"><span data-i18n="place_cat_nature">⛰ Tabiat & Tog'lar</span></button>
      <button type="button" class="pill" data-category="Museums"><span data-i18n="place_cat_museums">🎨 Muzey va San'at</span></button>
      <button type="button" class="pill" data-category="Museums"><span data-i18n="place_cat_restaurants">🍇 Restoranlar</span></button>
    </div>

    <div class="listing-layout">
      <div class="stay-list" id="placeList">
        <div class="review-skeleton-card"></div>
        <div class="review-skeleton-card"></div>
      </div>

      <div class="map-panel" id="mapPanel">
        <div id="mapMount" style="width:100%;height:100%;"></div>
      </div>
    </div>
  </div>
</section>

<div id="site-footer"></div>

<script src="js/partials.js"></script>
<script src="js/i18n.js"></script>
<script src="js/favorites.js"></script>
<script src="js/map.js"></script>
<script>
const API = window.Saffar_API_BASE || (location.protocol === "file:" ? "http://localhost:4000" : "");

function escapeHtml(str) {
  if (!str) return "";
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

let allPlaces = [];
let activeCity = "All";
let activeCategory = "All";
let placeMapController = null;

function getFilteredPlaces() {
  return allPlaces.filter(p => {
    if (activeCity !== "All") {
      const c = (p.city || "").toLowerCase();
      const a = activeCity.toLowerCase();
      const cityAliases = {
        "tashkent": ["tashkent", "toshkent"],
        "samarkand": ["samarkand", "samarqand"],
        "bukhara": ["bukhara", "buxoro"],
        "andijan": ["andijan", "andijon"],
        "fergana": ["fergana", "farg'ona", "farg`ona", "fargona"],
        "namangan": ["namangan"],
        "khorazm": ["khorazm", "xorazm", "xiva", "khiva"],
        "kashkadarya": ["kashkadarya", "qashqadaryo", "qarshi"],
        "surkhandarya": ["surkhandarya", "surxondaryo", "termiz"],
        "jizzakh": ["jizzakh", "jizzax"],
        "navoiy": ["navoiy", "navoi"],
        "sirdarya": ["sirdarya", "guliston"]
      };
      const allowed = cityAliases[a] || [a];
      if (!allowed.some(name => c.includes(name))) return false;
    }

    if (activeCategory !== "All") {
      const catMap = {
        "monuments": ["monument", "tarixiy", "obida", "maqbara"],
        "parks": ["park", "bog'", "xiyobon"],
        "bazaars": ["bazaar", "bozor", "rasta"],
        "nature": ["nature", "tabiat", "tog'", "ko'l", "sharshara"],
        "museums": ["museum", "muzey", "san'at", "galereya"]
      };
      const pc = (p.category || p.tag || "").toLowerCase();
      const ac = activeCategory.toLowerCase();
      const allowedCats = catMap[ac] || [ac];
      if (!allowedCats.some(t => pc.includes(t)) && !pc.includes(ac)) return false;
    }
    return true;
  });
}

function renderPlaceList() {
  const list = document.getElementById("placeList");
  const filtered = getFilteredPlaces();
  const countWord = window.Saffar_t ? window.Saffar_t("places_count_label") : "diqqatga sazovor joylar";
  const countEl = document.getElementById("placeCountLabel");
  if (countEl) countEl.textContent = `${filtered.length} ${countWord}`;

  if (!filtered.length) {
    const emptyTitle = window.Saffar_t ? window.Saffar_t("no_places_found") : "Ushbu mezon bo'yicha joylar topilmadi";
    const clearText = window.Saffar_t ? window.Saffar_t("btn_clear_filters") : "Filtrlarni tozalash";
    list.innerHTML = `
      <div class="empty-stays-card">
        <div class="empty-icon" aria-hidden="true">🏛</div>
        <h3>${escapeHtml(emptyTitle)}</h3>
        <button type="button" class="btn btn-ghost" onclick="resetPlaceFilters()" style="margin-top:12px;">${escapeHtml(clearText)}</button>
      </div>`;
    return;
  }

  const btnDetailsText = window.Saffar_t ? window.Saffar_t("btn_details") : "🔍 Batafsil";
  const btnMapsText = window.Saffar_t ? window.Saffar_t("btn_maps") : "📍 Xarita";

  list.innerHTML = filtered.map(p => {
    const isFav = window.SaffarFav ? window.SaffarFav.isFavorite("place", p.id) : false;
    const gMapUrl = p.googleMapsUrl || `https://maps.google.com/?q=${p.coordinates[0]},${p.coordinates[1]}`;

    return `
    <div class="stay-card place-card-item" data-id="${p.id}" onclick="selectPlace(${p.id}, true)">
      <div class="stay-thumb">
        <img src="${escapeHtml(p.image)}" alt="${escapeHtml(p.title)}" loading="lazy">
        <span class="badge-super">${escapeHtml(p.category || p.tag || "Joy")}</span>
        <button type="button" class="heart-btn ${isFav ? 'active' : ''}" aria-label="Favorite place" onclick="toggleFav(event, 'place', ${p.id})">${isFav ? '❤️' : '♡'}</button>
      </div>
      <div class="stay-body">
        <div class="stay-top">
          <div>
            <div class="stay-loc">${escapeHtml(p.city)}, O'zbekiston</div>
            <div class="stay-title" style="margin-top:4px;">${escapeHtml(p.title)}</div>
          </div>
          <div class="rating"><span style="color:var(--gold)" aria-hidden="true">★</span> ${p.rating || "5.0"}</div>
        </div>
        <div class="card-actions-row" style="margin-top:16px;">
          <a class="btn-detail" href="detail.html?type=place&id=${p.id}" onclick="event.stopPropagation()">${escapeHtml(btnDetailsText)}</a>
          <a class="btn-book" href="${escapeHtml(gMapUrl)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">${escapeHtml(btnMapsText)}</a>
        </div>
      </div>
    </div>`;
  }).join("");
}

window.addEventListener("Saffar_lang_changed", () => {
  renderPlaceList();
});

window.toggleFav = function(e, type, id) {
  e.stopPropagation();
  const item = allPlaces.find(x => x.id === id);
  if (item && window.SaffarFav) {
    const isNowFav = window.SaffarFav.toggleFavorite({ type: "place", id: item.id, title: item.title, city: item.city, price: item.category || "Place", image: item.image });
    const btn = e.currentTarget;
    btn.classList.toggle("active", isNowFav);
    btn.textContent = isNowFav ? "❤️" : "♡";
  }
};

window.selectPlace = function (id, syncMap) {
  const place = allPlaces.find((p) => p.id === id);
  if (!place) return;
  document.querySelectorAll(".place-card-item").forEach((c) => c.classList.remove("selected"));
  const cardEl = document.querySelector(`.place-card-item[data-id="${id}"]`);
  if (cardEl) {
    cardEl.classList.add("selected");
    if (!syncMap) cardEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }
  if (syncMap && placeMapController) placeMapController.highlightStay(id);
};

window.resetPlaceFilters = function() {
  activeCity = "All";
  activeCategory = "All";
  document.querySelectorAll("#placeCityFilterRow .pill").forEach(p => p.classList.toggle("active", p.dataset.city === "All"));
  document.querySelectorAll("#placeCategoryFilterRow .pill").forEach(p => p.classList.toggle("active", p.dataset.category === "All"));
  renderPlaceList();
  if (placeMapController) placeMapController.updateMarkers(allPlaces);
};

document.getElementById("placeCityFilterRow").addEventListener("click", (e) => {
  const pill = e.target.closest(".pill");
  if (!pill) return;
  document.querySelectorAll("#placeCityFilterRow .pill").forEach((p) => p.classList.remove("active"));
  pill.classList.add("active");
  activeCity = pill.dataset.city;
  renderPlaceList();
  const filtered = getFilteredPlaces();
  if (placeMapController) {
    placeMapController.updateMarkers(filtered);
    if (filtered.length > 0) selectPlace(filtered[0].id, true);
  }
});

document.getElementById("placeCategoryFilterRow").addEventListener("click", (e) => {
  const pill = e.target.closest(".pill");
  if (!pill) return;
  document.querySelectorAll("#placeCategoryFilterRow .pill").forEach((p) => p.classList.remove("active"));
  pill.classList.add("active");
  activeCategory = pill.dataset.category;
  renderPlaceList();
  const filtered = getFilteredPlaces();
  if (placeMapController) {
    placeMapController.updateMarkers(filtered);
    if (filtered.length > 0) selectPlace(filtered[0].id, true);
  }
});

async function loadPlaces() {
  try {
    const res = await fetch(`${API}/api/places`);
    const data = await res.json();
    allPlaces = data.places || [];
  } catch (err) {
    console.error("Failed to load places:", err);
    document.getElementById("placeList").innerHTML =
      `<p style="color:rgba(28,26,23,0.5);">Could not load places map. Make sure backend server is running.</p>`;
    return;
  }

  renderPlaceList();

  // Initialize Leaflet Map for Places
  placeMapController = window.initStaysMap("mapMount", allPlaces, (clickedPlace) => {
    selectPlace(clickedPlace.id, false);
  });

  if (allPlaces[0]) setTimeout(() => { selectPlace(allPlaces[0].id, true); }, 450);
}

loadPlaces();
</script>
</body>
</html>
